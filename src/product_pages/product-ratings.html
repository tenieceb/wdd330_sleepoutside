<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Rating Display</title>
  <link rel="stylesheet" href="ratings.css">
</head>
<body>

  <h2>Product Ratings</h2>

  <div class="product">
    <h3>Wireless Mouse</h3>
    <div class="rating" data-rating="4"></div>
    <p class="rating-text">4 out of 5</p>
  </div>

  <div class="product">
    <h3>USB Keyboard</h3>
    <div class="rating" data-rating="3"></div>
    <p class="rating-text">3 out of 5</p>
  </div>

  <div class="product">
    <h3>Bluetooth Headphones</h3>
    <div class="rating" data-rating="5"></div>
    <p class="rating-text">5 out of 5</p>
  </div>

  <script src="ratings.js"></script>
</body>
</html>
