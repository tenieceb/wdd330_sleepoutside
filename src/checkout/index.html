<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="dyn_header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
      </section>
      <h2>My Cart</h2>

        <ul class="product-list">
          <!-- Cart items will be dynamically inserted here -->
        </ul>
        <div class="subtotal" id="subtotal">Subtotal: $0.00</div>
       <form class="checkoutform" id="checkoutform">
          <div class="form-group">
            <label for="first_name">First Name <span class="required">*</span></label>
            <input 
              type="text" 
              id="first_name" 
              name="first_name" 
              required 
              placeholder="Your First Name"
            />
            <label for="last_name">Last Name <span class="required">*</span></label>
            <input 
              type="text" 
              id="last_name" 
              name="last_name" 
              required 
              placeholder="Your Last Name"
            />
          </div>

          <div class="form-group">
            <label for="email">Email <span class="required">*</span></label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              required 
              placeholder="your.email@example.com"
            />
          </div>

          <div class="form-group">
            <label for="street Address">Street Address</label>
            <input 
              type="text" 
              id="street_address" 
              name="street_address"
              required
              placeholder="123 Main Street"
            />
          </div>
          <div class="form-group">
            <label for="city">City</label>
            <input 
              type="text" 
              id="city" 
              name="city"
              required
              placeholder="Your City"
            />
          </div>
          <div class="form-group">
            <label for="state">State/Province</label>
            <input 
              type="text" 
              id="state" 
              name="state" 
              required
              placeholder="Your State or Province"
            />
          </div>
          <div class="form-group">
            <label for="zip">ZIP/Postal Code</label>
            <input 
              type="number" 
              id="zip" 
              name="zip" 
              required
              placeholder="Your ZIP or Postal Code"
            />

          <div class="form-group">
            <label for="credit_card">Credit Card Number</label>
            <input 
              type="number" 
              id="credit_card" 
              name="credit_card"
              required
              placeholder="1234 5678 9012 3456"
            />
          </div>
          <div class="form-group">
            <label for="expiration_date">Expiration Date</label>
            <input 
              type="month" 
              id="expiration_date" 
              name="expiration_date"
              required
            />
          </div>
          <div class="form-group">
            <label for="cvv">CVV</label>
            <input 
              type="number" 
              id="cvv" 
              name="cvv"
              required
              placeholder="123"
            /> 
          </div>
          <button type="submit">Place Order</button>
        </form>
        <div class="dyn_order_info" id="dyn_order_info"></div>
    </main>

    <footer id="dyn_footer"></footer>
  </body>
</html>
