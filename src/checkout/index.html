<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="dyn_header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
      </section>
      <h2>My Cart</h2>

      <ul class="product-list">
        <!-- Cart items will be dynamically inserted here -->
      </ul>
      <div class="subtotal" id="subtotal">Subtotal: $0.00</div>

      <p class="notice">
        ⚠️ This checkout form is part of a student project. Do not enter real
        personal or payment information.
      </p>
      <form class="checkoutform" id="checkoutform">
        <div class="form-group">
          <label for="fname">First Name <span class="">*</span></label>
          <input
            type="text"
            id="fname"
            name="fname"
            placeholder="Your First Name"
          />
          <label for="lname">Last Name <span class="">*</span></label>
          <input
            type="text"
            id="lname"
            name="lname"
            placeholder="Your Last Name"
          />
        </div>
        <div class="form-group">
          <label for="street">Street Address</label>
          <input
            type="text"
            id="street"
            name="street"
            placeholder="123 Main Street"
          />
        </div>
        <div class="form-group">
          <label for="city">City</label>
          <input type="text" id="city" name="city" placeholder="Your City" />
        </div>
        <div class="form-group">
          <label for="state">State/Province</label>
          <input
            type="text"
            id="state"
            name="state"
            placeholder="Your State or Province"
          />
        </div>
        <div class="form-group">
          <label for="zip">ZIP/Postal Code</label>
          <input
            type="text"
            id="zip"
            name="zip"
            inputmode="numeric"
            pattern="[0-9]{5}"
            maxlength="5"
            placeholder="12345"
          />
        </div>
        <div class="form-group">
          <label for="cardNumber">Credit Card Number</label>
          <input
            type="text"
            id="cardNumber"
            name="cardNumber"
            inputmode="numeric"
            pattern="[0-9\s]{13,19}"
            maxlength="19"
            placeholder="1234 5678 9012 3456"
          />
        </div>
        <div class="form-group">
          <label for="expiration">Expiration Date</label>
          <input
            type="text"
            id="expiration"
            name="expiration"
            placeholder="MM/YY"
            pattern="(0[1-9]|1[0-2])\/?([0-9]{2})"
            maxlength="5"
          />
        </div>
        <div class="form-group">
          <label for="code">CVV</label>
          <input
            type="text"
            inputmode="numeric"
            id="code"
            name="code"
            maxlength="3"
            placeholder="123"
          />
        </div>
        <button type="submit">Place Order</button>
        <small class="warning"
          >This is a demonstration form only. No payments are processed.</small
        >
      </form>
      <div class="dyn_order_info" id="dyn_order_info"></div>
    </main>

    <footer id="dyn_footer"></footer>
  </body>
</html>
