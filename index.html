<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Tracker</title>

  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      background-color: #f5f7fa;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 650px;
      margin: 40px auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group,
    .filter-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input, select {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      flex: 1;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      background-color: #1976d2;
      color: white;
    }

    button:hover {
      background-color: #125aa0;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #f9f9f9;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .movie-info {
      font-size: 14px;
    }

    .actions button {
      margin-left: 5px;
      background-color: #555;
    }

    .actions button.delete {
      background-color: #d32f2f;
    }

    .actions button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎬 Movie Tracker</h1>

    <div class="form-group">
      <input id="title" placeholder="Movie title" />
      <select id="status">
        <option>Watched</option>
        <option>Watching</option>
        <option>Wishlist</option>
      </select>
      <input id="rating" type="number" min="1" max="5" placeholder="Rating" />
      <button id="addBtn">Save</button>
    </div>

  <nav class="main-nav">
    <a href="./tracker/index.html">Track Shipment</a>
    <a href="shopping.html">Track Shopping</a>
  </nav>


    <div class="filter-group">
      <button onclick="setFilter('All')">All</button>
      <button onclick="setFilter('Watched')">Watched</button>
      <button onclick="setFilter('Watching')">Watching</button>
      <button onclick="setFilter('Wishlist')">Wishlist</button>
    </div>

    <ul id="movieList"></ul>
  </div>

  <script type="module" src="/src/js/movieTracker.js"></script>

</body>
</html>
